services:
  mcp-hoster-dev:
    build:
      context: .
      target: development
    working_dir: /workspaces/mcp_hoster
    ports:
      - "8080:8080"
      - "5173:5173"
    environment:
      HOST_BIND: "0.0.0.0"
      HOST_PORT: "8080"
      DATA_DIR: "/workspaces/mcp_hoster/data"
      DATABASE_URL: "sqlite:///workspaces/mcp_hoster/data/mcp-hoster.db"
      MIGRATIONS_DIR: "/workspaces/mcp_hoster/migrations"
      # Local POC: open until first user. Prefer BOOTSTRAP_ADMIN_* when exposing beyond localhost.
      AUTH_ALLOW_OPEN: "1"
    volumes:
      - ./:/workspaces/mcp_hoster
      - deno-cache:/deno-dir
      - npm-cache:/var/cache/npm
      - uv-cache:/var/cache/uv
    security_opt:
      - seccomp:unconfined
    command: ["deno", "task", "dev"]

volumes:
  deno-cache:
  npm-cache:
  uv-cache:
