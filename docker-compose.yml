services:
  mcp-hoster:
    # Prefer a release tag in production, e.g. ghcr.io/secretsound/mcp_host_server:v0.1.0
    image: ${MCP_HOSTER_IMAGE:-ghcr.io/secretsound/mcp_host_server:latest}
    build:
      context: .
      target: production
    pull_policy: ${MCP_HOSTER_PULL_POLICY:-missing}
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      HOST_BIND: "0.0.0.0"
      HOST_PORT: "8080"
      DATA_DIR: "/data"
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/mcp-hoster.db}
      MIGRATIONS_DIR: "/app/migrations"
      HOST_PUBLIC_URL: ${HOST_PUBLIC_URL:-}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-Admin}
      AUTH_ALLOW_OPEN: ${AUTH_ALLOW_OPEN:-0}
      AUTH_DISABLED: ${AUTH_DISABLED:-0}
    volumes:
      - ${MCP_HOSTER_DATA:-./data}:/data
    # Sandbox notes:
    # - bubblewrap is installed in the image, but nested user namespaces are often
    #   blocked by the host → probe falls back.
    # - Landlock needs Linux 5.13+ and a seccomp profile that allows its syscalls.
    #   Default Docker seccomp may block Landlock; unconfined fixes that.
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "deno",
          "eval",
          "const r=await fetch('http://127.0.0.1:8080/health'); if(!r.ok) Deno.exit(1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
